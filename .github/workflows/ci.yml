name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "26.4.0"
      - name: Install
        run: |
          python -m pip install -c deployment/requirements.lock setuptools wheel
          python -m pip install -c deployment/requirements.lock -e ".[dev]"
      - name: Ruff
        run: ruff check app tests scripts/run_insurance_poc_evaluation.py
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest -q
      - name: Frontend syntax
        run: |
          node --check app/ui/static/app.js
          node --check tools/local_portal/static/portal.js
          node tests/test_display_state.js
          node tests/test_portal_gates.js
      - name: Local portal contracts
        run: python -B -m unittest discover -s tools/local_portal -p test_server.py -q
      - name: Build
        run: python -m build --no-isolation
