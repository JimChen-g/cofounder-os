[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cofounder-os-gateway"
version = "0.1.0"
description = "Co-founder OS — governed multi-agent mission control for solo founders"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "JimChen-g" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
bridge = ["lark-oapi==1.7.3"]
dev = [
    "build>=1.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0,<0.6",
    "mypy>=1.10.0",
    "Pillow>=11.0.0",
    "reportlab>=4.2.0",
    "setuptools>=68",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.ui" = ["static/*.html", "static/*.css", "static/*.js"]
"app.insurance_poc.fixtures" = ["*.json", "*.md", "*.pdf", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
